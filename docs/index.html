<!doctype html>
<html lang="de-CH">
<head>
  <base href="/Cupra-Instant-Drive/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07101f">
  <title>CUPRA Instant Drive · Archiviert</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #07101f;
      color: #f7f2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(620px, 100%);
      padding: 42px;
      border: 1px solid rgba(199, 127, 91, .38);
      border-radius: 22px;
      background: #0d1727;
    }
    .label {
      margin: 0 0 14px;
      color: #c77f5b;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 18px; font-size: clamp(34px, 7vw, 58px); line-height: 1; }
    p { margin: 0; color: #c6cbd4; font-size: 17px; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <p class="label">Projekt archiviert</p>
    <h1>CUPRA Instant Drive</h1>
    <p>Diese fiktive Demo wurde deaktiviert und wird derzeit nicht mehr öffentlich bereitgestellt.</p>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((items) => {
        items.forEach((item) => item.unregister());
      });
    }
    if ("caches" in window) {
      caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
    }
  </script>
</body>
</html>
